name: Publish Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release and attach Windows executable
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }} — 다국어 지원
          body: |
            ## 다국어 입력 지원

            - 일본어·중국어·러시아어·아랍어·힌디어 자동 감지
            - 영어·스페인어·프랑스어·독일어 등은 입력 언어 선택 가능
            - 조회 결과를 Anki용 TSV에 자동 저장

            `AnkiWordCollector_Multilingual.exe`를 다운로드해 실행하세요. Python 설치는 필요 없습니다.
          files: outputs/AnkiWordCollector_Multilingual.exe
